# This file is only read by Netlify when the site's base directory is
# `packages/collected-works`, which it now has to be.
#
# The pages are server-rendered, so `build/` holds no HTML at all — every route is served by
# `.netlify/functions-internal/sveltekit-render.mjs`, which declares its own routing with
# `path: ["/*"]` and `preferStatic: true`. The adapter writes that function relative to this
# package, because that is the working directory pnpm runs a package's script from. Netlify
# has to look for it in the same place, and that is what the base directory decides.
#
# With base pointed here, Netlify and the adapter finally share a working directory, so the
# two keys below mean the same thing to both of them — which they did not when base was the
# repo root. pnpm walks up to the workspace root for the lockfile, so installing from here
# still resolves the whole monorepo.
#
# Leave the dashboard's build command and publish directory empty; these take precedence.

[build]
    command = "pnpm build"
    publish = "build"

# Vite 8 requires Node ^20.19 || >=22.12, and nothing else in the repo pins a version, so
# without this the build runs on whatever the build image defaults to.
[build.environment]
    NODE_VERSION = "22"
