# Deliberately no [build] block. The site's base directory is the repo root and its package
# directory is packages/collected-works, which means Netlify reads this file but runs the
# build from /opt/build/repo — so `command` and `publish` here would be resolved against the
# root, not against this package. A `publish = "build"` became /opt/build/repo/build, and a
# `command = "pnpm build"` looked for a build script in the root package.json, which has none.
#
# Worse, they cannot simply be rewritten root-relative: `@sveltejs/adapter-netlify` reads this
# same file to decide where to write, and it runs with this package as its working directory,
# because that is where pnpm runs a package's script from. One `publish` value cannot be
# correct for two readers with different working directories.
#
# So the build command and publish directory live in the Netlify dashboard:
#
#   Build command:      pnpm --filter collected-works... run build
#   Publish directory:  packages/collected-works/build
#
# and the adapter falls back to its own default of `build` relative to this package, which
# lands in exactly that place.

# Read by Netlify from here, which the build log confirms. Vite 8 requires
# Node ^20.19 || >=22.12, and nothing else in the repo pins a version, so without this the
# build runs on whatever the build image defaults to.
[build.environment]
    NODE_VERSION = "22"
