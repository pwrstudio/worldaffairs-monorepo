# Scoped to this package on purpose. Netlify reads the netlify.toml found in a site's
# base directory, so this file is only picked up by a site whose base is set to
# packages/collected-works — it cannot reach the worldaffairs.se site, which carries no
# netlify.toml of its own and is configured entirely from the dashboard.
#
# Set the new site's base directory to `packages/collected-works`. pnpm walks up to the
# workspace root for the lockfile, so the install still resolves the whole monorepo.

[build]
    command = "pnpm build"
    publish = "build"
